<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="#3b82f6" stroke-width="4"/>
  
  <!-- Glow effect -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  
  <!-- Anvil base (bottom) -->
  <path d="M180 340 L332 340 L320 300 L192 300 Z" fill="#3b82f6" opacity="0.8"/>
  <rect x="200" y="340" width="112" height="20" rx="4" fill="#2563eb"/>
  
  <!-- Anvil body -->
  <path d="M200 300 L220 220 L292 220 L312 300" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Forge hammer -->
  <line x1="260" y1="220" x2="260" y2="140" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
  <rect x="230" y="120" width="60" height="24" rx="6" fill="#60a5fa"/>
  
  <!-- Ascending spark/flame -->
  <path d="M260 120 Q260 80 280 60 Q300 40 290 20" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <circle cx="290" cy="16" r="6" fill="#fbbf24"/>
  
  <!-- Small sparks -->
  <circle cx="230" cy="90" r="3" fill="#fcd34d" opacity="0.8"/>
  <circle cx="300" cy="70" r="2" fill="#fcd34d" opacity="0.6"/>
  <circle cx="215" cy="110" r="2" fill="#fcd34d" opacity="0.5"/>
</svg>
