<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little something for you</title>
<meta name="description" content="Someone made you a bouquet. Tap to open.">
<meta name="theme-color" content="#f6efe0">
<meta property="og:title" content="A little something for you">
<meta property="og:description" content="Someone made you a bouquet. Tap to open.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&family=Dancing+Script:wght@400;600&family=Lora:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/gift.css">
</head>
<body class="locked">
<div class="wash"></div>

<main class="scene" id="scene">
  <section class="surface">
    <div class="from" id="from"></div>
    <h2 id="headline"></h2>
    <div class="bq" id="bq"></div>
    <div class="scroll">Scroll to explore<span>↓</span></div>
  </section>

  <section class="notes">
    <div class="tag" id="tag" hidden>
      <svg viewBox="0 0 26 34" fill="none" stroke="#6d8f55" stroke-width="1.2" stroke-linecap="round"><path d="M13 33V12M13 24c-4-1-6-4-6-7 4 0 6 3 6 7zm0-6c4-1 6-4 6-7-4 0-6 3-6 7zM13 12c-3-2-3-6 0-10 3 4 3 8 0 10z"/></svg>
      <div><span id="tagName"></span><small id="tagMeaning"></small></div>
    </div>
    <article class="note" id="note">
      <svg class="clip" viewBox="0 0 22 64" fill="none" stroke="#c9a15a" stroke-width="2.4" stroke-linecap="round"><path d="M6 40V14a5 5 0 0 1 10 0v34a8 8 0 0 1-16 0V20" transform="translate(3 4)"/></svg>
      <div class="meta">
        <div><p><small>TO:</small><span id="to"></span></p><p><small>FROM:</small><span id="by"></span></p></div>
        <div class="stamp" id="stamp">FLOWERS</div>
      </div>
      <div class="body" id="body"></div>
      <div class="sign" id="sign"></div>
    </article>
    <div class="actions">
      <button class="pill" id="share">Share this gift</button>
      <button class="pill" id="replay">Replay the bouquet</button>
    </div>
  </section>
</main>

<div class="fall" id="fall" aria-hidden="true"></div>

<div class="opener" id="opener">
  <div class="popup">
    <div class="kicker" id="oFrom">A little something</div>
    <h1 id="oTitle">For you</h1>
    <button class="env" id="env" aria-label="Open your gift">
      <div class="back"></div>
      <div class="letter">Open me…<b id="oLetter"></b></div>
      <div class="front"></div>
      <div class="flap"></div>
      <svg class="sprig" viewBox="0 0 90 70" fill="none" stroke-linecap="round"><g stroke="#6f8f66" stroke-width="1.6"><path d="M45 68V28M45 50c-9-2-16-9-17-18M45 44c9-2 15-8 17-17"/></g><g fill="#a9c29a"><ellipse cx="30" cy="38" rx="8" ry="4" transform="rotate(-40 30 38)"/><ellipse cx="60" cy="34" rx="8" ry="4" transform="rotate(40 60 34)"/></g><g fill="#c997c4"><circle cx="45" cy="20" r="6"/><circle cx="33" cy="26" r="5"/><circle cx="57" cy="24" r="5"/></g></svg>
    </button>
    <div class="hint">Tap the envelope</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/bouquet.js"></script>
<script src="js/codec.js"></script>
<script src="js/gift.js"></script>
</body>
</html>
